name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Engine tests (DRIFT validation + section shapes)
        run: npm test
      - name: Build single-file app
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: openround-web, path: dist/index.html }
